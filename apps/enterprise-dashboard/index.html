<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Funti3rPay — Cross-Border Payroll for Africa</title>
    <meta name="description" content="Funti3rPay enables enterprises to pay African workers instantly in local currencies using blockchain-powered rails." />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Funti3rPay — Cross-Border Payroll for Africa" />
    <meta property="og:description" content="Pay African workers instantly in local currencies. Powered by Stellar blockchain." />
    <meta property="og:image" content="/images/logo.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Funti3rPay" />
    <meta name="twitter:description" content="Cross-border payroll for Africa, powered by Stellar." />
    <meta name="twitter:image" content="/images/logo.png" />

    <!-- Theme -->
    <meta name="theme-color" content="#1a1a2e" />
    <link rel="icon" type="image/png" href="/images/icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      // Initialize Stellar Wallets Kit OUTSIDE React to avoid lifecycle conflicts
      import { StellarWalletsKit } from '@creit.tech/stellar-wallets-kit/sdk';
      import { defaultModules } from '@creit.tech/stellar-wallets-kit/modules/utils';

      try {
        console.log('[INIT] Initializing Stellar Wallets Kit');
        StellarWalletsKit.init({ modules: defaultModules() });
        window.__walletKitReady = true;
        console.log('[INIT] Stellar Wallets Kit initialized');
      } catch (error) {
        console.error('[INIT] Failed to initialize kit:', error);
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
