[package]
name = "funti3r-escrow"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["lib", "cdylib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
# Attack (property) tests: random operation sequences checked against the money invariants. Test-only, not in the Wasm.
proptest = "1.11"
