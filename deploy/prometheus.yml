# Scrape config for the optional monitoring profile: `docker compose --profile monitoring up -d prometheus`.
# Every target is on the internal network; none is published, so metrics are visible to Prometheus and to no one else.
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: services
    metrics_path: /metrics
    static_configs:
      - targets: ['user-service:3001', 'payment-service:3002', 'compliance-service:3003', 'analytics-service:3004', 'api-gateway:9464']
